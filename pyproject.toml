[project]
name = "stmatch"
version = "0.1.0"
description = "A python package to align and PSF-match HST and JWST images"
readme = "README.md"
authors = [
    { name = "James Nianias", email = "jnianias@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.0",
    "numpy>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
